<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#080808;
  color:#f5f1e8;
  font-family:"DM Sans",sans-serif;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

/* NAVBAR */

nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:78px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:100;
  background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);
}

.logo{
  font-size:14px;
  letter-spacing:3px;
  font-weight:600;
}

.navlinks{
  display:flex;
  gap:32px;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.navlinks a{
  opacity:.7;
  transition:.3s;
}

.navlinks a:hover{
  opacity:1;
}

  padding:120px 7% 80px;
  overflow:hidden;
}
